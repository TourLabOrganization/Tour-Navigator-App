<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>body{margin:0;background:#e6e4e1;font-family:Archivo,sans-serif;color:#201e1d}</style>
</helmet>
<div style="max-width:960px;margin:0 auto;padding:28px 20px 60px">
<div style="font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#ec3013">Marker study</div>
<h1 style="font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px">원 아이콘 후보 5안</h1>
<p style="font-size:13px;font-weight:400;line-height:1.5;margin:0 0 24px;max-width:56ch;color:rgba(32,30,29,.7)">실제 마커와 같은 캔버스 렌더링. 각 안은 번호 마커 · 지역 클러스터 · 코스 선택 상태 · 장소목록 외(·) 네 가지를 함께 보여준다.</p>
<sc-for list="{{ cands }}" as="c" hint-placeholder-count="5">
<section style="border-top:2px solid #201e1d;padding:18px 0 22px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px">
<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
<span style="font-size:11px;font-weight:800;letter-spacing:.1em;color:#ec3013">{{ c.tag }}</span>
<h2 style="font-size:19px;font-weight:800;letter-spacing:-.01em;margin:0">{{ c.name }}</h2>
<span style="font-size:12px;font-weight:400;color:rgba(32,30,29,.65)">{{ c.note }}</span>
</div>
<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:#f3f2f2;border:2px solid #201e1d;padding:14px">
<sc-for list="{{ c.samples }}" as="s" hint-placeholder-count="8">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:64px">
<canvas ref="{{ s.ref }}" width="96" height="112" style="width:48px;height:56px"></canvas>
<span style="font-size:8px;font-weight:600;letter-spacing:.04em;text-align:center;color:rgba(32,30,29,.55);text-transform:uppercase">{{ s.label }}</span>
</div>
</sc-for>
</div>
</section>
</sc-for>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:960,&quot;height&quot;:1400}}">
const INK='#201e1d', PAPER='#f3f2f2', RED='#ec3013';
const CATS=[
  {key:'sea',label:'해양자연',bg:'#BFE3F2',fg:'#0d4a63'},
  {key:'heal',label:'힐링생태',bg:'#CDEBC5',fg:'#1f5418'},
  {key:'herit',label:'역사문화',bg:'#F7E5A8',fg:'#5c4405'},
  {key:'activity',label:'테마파크',bg:'#DED2F5',fg:'#3b2470'},
  {key:'stay',label:'숙박로컬',bg:'#F8D3E2',fg:'#7a1a42'},
  {key:'food',label:'로컬상권',bg:'#F6C6BC',fg:'#8a2410'}
];
const DEFS=[
  {tag:'A',name:'잉크 링',note:'흰 바탕 · 얇은 잉크 테두리 · 카테고리 색은 하단 도트로만'},
  {tag:'B',name:'솔리드 플랫',note:'현재안 개량 — 크기 28px, 테두리 1.5px, 옵티컬 정렬'},
  {tag:'C',name:'핀 드롭',note:'원 아래 꼭지 · 좌표 지점이 명확함'},
  {tag:'D',name:'듀오톤',note:'상단 카테고리 색 / 하단 페이퍼 · 번호는 아래 칸'},
  {tag:'E',name:'헤일로',note:'반투명 외곽 후광 + 흰 링 · 위성지도에서도 뜬다'}
];
const R=96/2;

function circle(ctx,cx,cy,r){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);}
function setFont(ctx,size,w){ctx.font=(w||800)+' '+size+'px Archivo, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';}
function shadow(ctx,on){if(on){ctx.shadowColor='rgba(32,30,29,.35)';ctx.shadowBlur=6;ctx.shadowOffsetY=2;}else{ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;}}

function draw(tag,ctx,o){
  ctx.clearRect(0,0,96,112);
  ctx.save();
  const t=String(o.text), long=t.length>2;
  const cx=48, cy=48;
  const sel=o.state==='course';
  if(tag==='A'){
    const r=42;
    shadow(ctx,true);
    ctx.fillStyle=sel?INK:PAPER;circle(ctx,cx,cy,r);ctx.fill();
    shadow(ctx,false);
    ctx.lineWidth=3;ctx.strokeStyle=sel?INK:'rgba(32,30,29,.85)';circle(ctx,cx,cy,r);ctx.stroke();
    ctx.fillStyle=sel?PAPER:INK;setFont(ctx,long?26:34);ctx.fillText(t,cx,cy-4);
    ctx.fillStyle=sel?RED:o.bg;circle(ctx,cx,cy+24,6);ctx.fill();
    ctx.lineWidth=1.5;ctx.strokeStyle=sel?PAPER:'rgba(32,30,29,.5)';circle(ctx,cx,cy+24,6);ctx.stroke();
  }
  if(tag==='B'){
    const r=44;
    shadow(ctx,true);
    ctx.fillStyle=sel?INK:o.bg;circle(ctx,cx,cy,r);ctx.fill();
    shadow(ctx,false);
    ctx.lineWidth=5;ctx.strokeStyle=INK;circle(ctx,cx,cy,r);ctx.stroke();
    ctx.fillStyle=sel?PAPER:o.fg;setFont(ctx,long?27:36);ctx.fillText(t,cx,cy+1);
  }
  if(tag==='C'){
    const r=38, ty=96;
    shadow(ctx,true);
    ctx.fillStyle=sel?INK:o.bg;
    ctx.beginPath();
    ctx.moveTo(cx,ty);
    ctx.quadraticCurveTo(cx-r*0.55,cy+r*0.72,cx-r*0.86,cy+r*0.5);
    ctx.arc(cx,cy,r,Math.PI*0.84,Math.PI*0.16,false);
    ctx.quadraticCurveTo(cx+r*0.55,cy+r*0.72,cx,ty);
    ctx.closePath();ctx.fill();
    shadow(ctx,false);
    ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.stroke();
    ctx.fillStyle=sel?PAPER:o.fg;setFont(ctx,long?25:33);ctx.fillText(t,cx,cy-2);
  }
  if(tag==='D'){
    const r=44;
    shadow(ctx,true);
    ctx.fillStyle=PAPER;circle(ctx,cx,cy,r);ctx.fill();
    shadow(ctx,false);
    ctx.save();
    circle(ctx,cx,cy,r);ctx.clip();
    ctx.fillStyle=sel?INK:o.bg;ctx.fillRect(0,0,96,cy-6);
    ctx.fillStyle=sel?INK:'rgba(32,30,29,.12)';ctx.fillRect(0,cy-8,96,3);
    ctx.restore();
    ctx.lineWidth=5;ctx.strokeStyle=INK;circle(ctx,cx,cy,r);ctx.stroke();
    ctx.fillStyle=sel?PAPER:o.fg;setFont(ctx,long?18:22,800);ctx.fillText(o.top||'', cx, cy-24);
    ctx.fillStyle=INK;setFont(ctx,long?24:30);ctx.fillText(t,cx,cy+22);
  }
  if(tag==='E'){
    ctx.fillStyle=(sel?'rgba(236,48,19,.28)':hexa(o.bg,.4));circle(ctx,cx,cy,46);ctx.fill();
    shadow(ctx,true);
    ctx.fillStyle=sel?RED:o.bg;circle(ctx,cx,cy,34);ctx.fill();
    shadow(ctx,false);
    ctx.lineWidth=5;ctx.strokeStyle=PAPER;circle(ctx,cx,cy,34);ctx.stroke();
    ctx.lineWidth=1.5;ctx.strokeStyle='rgba(32,30,29,.55)';circle(ctx,cx,cy,37);ctx.stroke();
    ctx.fillStyle=sel?PAPER:o.fg;setFont(ctx,long?24:31);ctx.fillText(t,cx,cy+1);
  }
  ctx.restore();
}
function hexa(hex,a){
  const h=hex.replace('#','');
  const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}

class Component extends DCLogic {
  constructor(p){super(p);this._c={};}
  componentDidMount(){this.paint();setTimeout(()=>this.paint(),400);document.fonts&&document.fonts.ready.then(()=>this.paint());}
  paint(){
    DEFS.forEach(d=>{
      this.samples().forEach(s=>{
        const el=this._c[d.tag+s.id];
        if(!el)return;
        draw(d.tag,el.getContext('2d'),s);
      });
    });
  }
  samples(){
    return [
      {id:'s1',label:'01 해양',text:'01',bg:CATS[0].bg,fg:CATS[0].fg,top:'해양'},
      {id:'s2',label:'07 힐링',text:'07',bg:CATS[1].bg,fg:CATS[1].fg,top:'힐링'},
      {id:'s3',label:'12 역사',text:'12',bg:CATS[2].bg,fg:CATS[2].fg,top:'역사'},
      {id:'s4',label:'23 테마',text:'23',bg:CATS[3].bg,fg:CATS[3].fg,top:'테마'},
      {id:'s5',label:'숙박',text:'04',bg:CATS[4].bg,fg:CATS[4].fg,top:'숙박'},
      {id:'s6',label:'코스 선택',text:'05',bg:CATS[5].bg,fg:CATS[5].fg,top:'상권',state:'course'},
      {id:'s7',label:'목록 외',text:'·',bg:CATS[2].bg,fg:CATS[2].fg,top:'외'},
      {id:'s8',label:'클러스터',text:'경주',bg:PAPER,fg:INK,top:'지역'}
    ];
  }
  renderVals(){
    const S=this.samples();
    return {
      cands:DEFS.map(d=>({
        key:d.tag,tag:d.tag,name:d.name,note:d.note,
        samples:S.map(s=>({key:d.tag+s.id,label:s.label,ref:el=>{if(el){this._c[d.tag+s.id]=el;draw(d.tag,el.getContext('2d'),s);}}}))
      }))
    };
  }
}

</script>
</body>
</html>
